<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Skin Log">
<meta name="theme-color" content="#f5f0ea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Skin Log</title>
<style>
:root{
  --bg:#f5f0ea; --card:#fffdfa; --ink:#2a231f; --muted:#7b6f67; --line:#e7ddd3;
  --accent:#b8553a; --accent-ink:#fff; --soft:#f0e6dc; --good:#3f8a5f; --bad:#c0463a; --chip:#efe5db; --fchip:#e5ecf3; --fink:#36536e;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --serif:ui-serif,"New York",Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1b1715;--card:#25201d;--ink:#f1e9e2;--muted:#a59a91;--line:#3a322d;--soft:#2f2824;--chip:#352d28;--fchip:#26313c;--fink:#a9c3dc;--accent:#d56d4f;--good:#62b585;--bad:#e2685b;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 84px);overscroll-behavior-y:none}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
h1{font-size:25px;letter-spacing:-.01em}
h2{font-size:19px;margin:22px 0 10px}
h3{font-size:16px;margin:14px 0 6px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.gear{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.gear svg{width:22px;height:22px}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:12px}
.hidden{display:none!important}
/* camera */
.cam{position:relative;border-radius:22px;overflow:hidden;background:#111;aspect-ratio:3/4;max-height:62vh;width:100%;margin:0 auto}
.cam video,.cam .ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam.mirror video,.cam.mirror .ghost{transform:scaleX(-1)}
.cam .ghost{opacity:0;pointer-events:none;transition:opacity .2s}
.cam .ghost.on{opacity:.32}
.cam .controls{position:absolute;left:0;right:0;bottom:14px;display:flex;align-items:center;justify-content:space-around}
.shutter{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.45);background-clip:padding-box;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.shutter:active{transform:scale(.94)}
.camBtn{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.camBtn svg{width:22px;height:22px}
.camBtn.on{background:rgba(255,255,255,.85);color:#111}
.cam .msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ddd;text-align:center;padding:24px;gap:12px;font-size:14px}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:200px;border-radius:22px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:18px;box-shadow:var(--shadow);cursor:pointer;user-select:none}
.big svg{width:46px;height:46px}
.alt{display:flex;justify-content:center;gap:18px;margin:12px 0 4px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.alt label,.alt button{text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--muted)}
.preview{position:relative;border-radius:16px;overflow:hidden;background:var(--soft)}
.preview img{display:block;width:100%;max-height:300px;object-fit:cover}
.preview .x{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:5px 11px;font-size:13px}
.ai{font-size:13px;color:var(--muted);margin:10px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ai b{color:var(--ink)}
.label{font-size:13px;font-weight:600;margin:16px 0 8px;display:flex;justify-content:space-between}
.label span{font-weight:400;color:var(--muted)}
.rates{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.rates button{height:40px;border-radius:10px;background:var(--soft);font-weight:600;font-size:14px;border:2px solid transparent}
.rates button.on{border-color:var(--ink);color:#fff}
textarea,input,select{font:inherit;color:inherit;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;font-size:16px}
textarea{min-height:110px;resize:vertical}
.mic{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:14px;background:var(--soft);border:1px solid var(--line);font-weight:600;margin-bottom:8px}
.mic svg{width:20px;height:20px}
.mic.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
.mic.rec .dot{width:9px;height:9px;border-radius:50%;background:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.primary{width:100%;margin-top:14px;padding:15px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px}
.primary:disabled{opacity:.5}
.btn{padding:8px 13px;border-radius:10px;background:var(--soft);font-size:14px;font-weight:500;border:1px solid var(--line)}
.btn.danger{color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{background:var(--chip);border-radius:99px;padding:3px 9px;font-size:12.5px}
.chip.f{background:var(--fchip);color:var(--fink)}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 7px;border-radius:9px;font-weight:600;color:#fff;font-size:14px}
.badge.ai{opacity:.8;border:1.5px dashed rgba(255,255,255,.85)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto;margin:0 -4px}
.entry{display:flex;gap:12px;cursor:pointer}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--soft);flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px}
.entry .meta{flex:1;min-width:0}
.entry .memo{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.daylabel{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:16px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid .g{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--soft);cursor:pointer}
.grid img{width:100%;height:100%;object-fit:cover}
.grid .g .badge{position:absolute;left:6px;bottom:6px;min-width:24px;height:24px;font-size:12px}
.grid .g .d{position:absolute;right:6px;bottom:6px;font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;margin-bottom:10px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(env(safe-area-inset-bottom) + 4px);z-index:20}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(20,12,8,.45);z-index:40;display:flex;align-items:flex-end}
.sheet .panel{background:var(--bg);width:100%;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:16px 14px calc(env(safe-area-inset-bottom) + 24px)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.banner button{color:var(--accent);font-weight:600;text-decoration:underline}
.eff{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.eff:last-child{border-bottom:0}
.eff .n{flex:1;min-width:0}
.eff .n small{display:block;color:var(--muted);font-size:12px}
.bar{width:100px;height:10px;position:relative;background:var(--soft);border-radius:5px;flex:none}
.bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.bar:after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.delta{width:44px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.md p{margin:0 0 10px}.md ul{margin:0 0 10px;padding-left:20px}.md li{margin:3px 0}.md h4{font-family:var(--serif);font-size:15.5px;margin:14px 0 6px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-1px}
@keyframes s{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.edit-row{display:grid;grid-template-columns:1fr 104px 32px;gap:6px;margin-bottom:6px}
.edit-row .wide{grid-column:1/-1}
.edit-row input,.edit-row select{padding:7px 8px;border-radius:9px}
.edit-row .rm{color:var(--bad);font-size:20px}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.areas{position:absolute;top:10px;left:8px;right:8px;display:flex;gap:6px;justify-content:center;z-index:2}
.areas button{background:rgba(0,0,0,.45);color:#fff;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600}
.areas button.done{background:rgba(63,138,95,.9)}
.areas button.on{background:#fff;color:#111}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.shot{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);border:1px dashed var(--line);cursor:pointer}
.shot.has{border:0}
.shot img{width:100%;height:100%;object-fit:cover}
.shot span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px}
.shot .badge{position:absolute;right:4px;top:4px;min-width:22px;height:22px;font-size:11px;padding:0 5px}
.photos2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.photos2 .shot{border:0;cursor:default}
.arow{margin-bottom:10px}
.arow .an{font-size:12.5px;color:var(--muted);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.rates.sm button{height:34px;font-size:13px;border-radius:9px}
.chip.pick{cursor:pointer;padding:7px 12px;font-size:13.5px;border:1.5px solid var(--line);background:var(--card)}
.chip.pick.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.f.pick.on{background:var(--fink);border-color:var(--fink);color:var(--card)}
.results{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden;box-shadow:var(--shadow)}
.results button{display:block;width:100%;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);font-size:14.5px}
.results button:last-child{border-bottom:0}
.results small{color:var(--muted)}
.selrow{display:grid;grid-template-columns:1fr 78px 82px 26px;gap:6px;align-items:center;margin-top:8px;font-size:14px}
.selrow select{padding:6px 4px;font-size:14px;border-radius:9px}
.selrow .rm{color:var(--bad);font-size:20px}
.selrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:38px;height:38px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-size:20px;font-weight:600}
.stepper b{min-width:30px;text-align:center;font-size:17px}
.subhead{font-size:12px;color:var(--muted);margin:12px 0 2px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.chip.flag{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.inci{font-size:13px;color:var(--muted);line-height:1.6}
a{color:var(--accent)}
tr.click{cursor:pointer}
.toggle input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--accent)}
</style>
</head>
<body>

<div class="top">
  <h1>Skin Log</h1>
  <button class="gear" id="openSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div>
<div id="banner"></div>

<!-- LOG -->
<section id="v-log">
  <div id="capture">
    <div class="cam mirror" id="cam">
      <video id="video" playsinline autoplay muted></video>
      <img class="ghost" id="ghost" alt="">
      <div class="areas" id="areaTabs"></div>
      <div class="msg" id="camMsg">
        <div>Starting camera…</div>
      </div>
      <div class="controls" id="camControls">
        <button class="camBtn" id="ghostBtn" title="Line up with your last photo">Align</button>
        <button class="shutter" id="shutter" aria-label="Take photo"></button>
        <button class="camBtn" id="flipBtn" aria-label="Switch camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8M21 3v5h-5M21 12a9 9 0 0 1-15.5 6.2L3 16M3 21v-5h5"/></svg></button>
      </div>
    </div>
    <label class="big hidden" id="sysCamBig" for="sysCam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.8"/></svg>
      Take today's photo
    </label>
    <input id="sysCam" type="file" accept="image/*" capture="user" class="hidden">
    <input id="lib" type="file" accept="image/*" class="hidden">
    <div class="shots" id="capShots"></div>
    <button class="primary hidden" id="continueBtn"></button>
    <div class="alt"><label for="lib">Library</label><label for="sysCam">System camera</label><button id="nophoto">No photos</button></div>
  </div>

  <div id="draft" class="card hidden">
    <div class="shots" id="draftShots" style="margin-top:0"></div>

    <div class="label">How's your skin? <span>0 clear · 10 worst</span></div>
    <div id="rateRows"></div>

    <div class="label">Products <span>tap what you used</span></div>
    <div class="chips" id="quickProds"></div>
    <input id="prodSearch" placeholder="Search or add a product…" autocomplete="off" autocapitalize="words" style="margin-top:8px">
    <div id="prodResults" class="results hidden"></div>
    <div id="selProds"></div>

    <div class="label">Anything else? <span>talk it out</span></div>
    <button class="mic hidden" id="micBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>Tap to talk</span></button>
    <textarea id="memo" placeholder="e.g. Slept about 5 hours, stressed about work, had pizza last night, picked at my chin. (Products you mention here get added too.)"></textarea>
    <div class="hint" id="memoHint">Talk or type. Haiku adds anything you mention to the table after you save.</div>

    <div class="label">Daily</div>
    <div class="row" style="justify-content:space-between"><span>💧 Water <span class="sub">(glasses)</span></span><div class="stepper"><button id="wMinus" aria-label="Less water">−</button><b id="wVal">–</b><button id="wPlus" aria-label="More water">+</button></div></div>
    <div class="subhead">Bedding changed today</div><div class="chips" id="bedChips"></div>
    <div class="subhead">Diet &amp; habits</div><div class="chips" id="dietChips"></div>

    <div class="label">Notes <span>anything else worth remembering</span></div>
    <textarea id="notes" style="min-height:64px" placeholder="New laundry detergent, very dry weather, derm appointment…"></textarea>

    <button class="primary" id="save">Save entry</button>
    <div class="alt"><button id="cancel">Cancel</button></div>
  </div>

  <div id="lastSaved"></div>
</section>

<section id="v-history" class="hidden">
  <div class="seg" id="histSeg"><button data-m="list" class="on">Entries</button><button data-m="photos">Photo timeline</button></div>
  <div id="histBody"></div>
</section>
<section id="v-products" class="hidden"><div id="prodBody"></div></section>
<section id="v-insights" class="hidden"><div id="insBody"></div></section>

<nav id="nav">
  <button data-v="log" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 8v8M8 12h8"/></svg>Log</button>
  <button data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 15l4-4 4 4 3-3 5 5"/></svg>History</button>
  <button data-v="products"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6v4H9zM8 7h8l1 3v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V10z"/></svg>Products</button>
  <button data-v="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Insights</button>
</nav>

<div id="sheet" class="sheet hidden"><div class="panel" id="sheetPanel"></div></div>
<div id="toast" class="toast hidden"></div>
<input id="importFile" type="file" accept="application/json,.json" class="hidden">

<script>
"use strict";
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = t => { const d = new Date(t); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); };
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const dayDiff = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const fmtDay = s => { const today = ymd(Date.now()); if (s === today) return "Today"; if (s === addDays(today,-1)) return "Yesterday"; return parseYmd(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); };
const fmtTime = t => new Date(t).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
const shortDay = d => parseYmd(d).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const mean = a => a.reduce((s,x)=>s+x,0) / a.length;
const variance = a => { if (a.length < 2) return 0; const m = mean(a); return a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1); };
const rateColor = r => { if (r == null) return "#9a8f86"; const t = Math.max(0, Math.min(10, r)) / 10; return `hsl(${140 - 135*t} 50% ${44 - 4*t}%)`; };

/* ================= local storage (IndexedDB) ================= */
const store = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open("skinlog", 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("entries", { keyPath: "id" }); d.createObjectStore("photos"); d.createObjectStore("kv"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const run = (name, mode, fn) => open().then(d => new Promise((res, rej) => {
    const t = d.transaction(name, mode); const req = fn(t.objectStore(name));
    t.oncomplete = () => res(req && "result" in req ? req.result : undefined);
    t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  return {
    allEntries: () => run("entries", "readonly", s => s.getAll()),
    putEntry: e => run("entries", "readwrite", s => s.put(e)),
    delEntry: id => run("entries", "readwrite", s => s.delete(id)),
    getPhoto: id => run("photos", "readonly", s => s.get(id)),
    putPhoto: (id, blob) => run("photos", "readwrite", s => s.put(blob, id)),
    delPhoto: id => run("photos", "readwrite", s => s.delete(id)),
    allPhotoKeys: () => run("photos", "readonly", s => s.getAllKeys()),
    get: k => run("kv", "readonly", s => s.get(k)),
    set: (k, v) => run("kv", "readwrite", s => s.put(v, k)),
    clearAll: () => open().then(d => new Promise((res, rej) => { const t = d.transaction(["entries","photos","kv"], "readwrite"); ["entries","photos","kv"].forEach(n => t.objectStore(n).clear()); t.oncomplete = res; t.onerror = () => rej(t.error); })),
  };
})();
const photoURLs = new Map();
async function photoURL(id){
  if (photoURLs.has(id)) return photoURLs.get(id);
  const b = await store.getPhoto(id).catch(()=>null); if (!b) return "";
  const u = URL.createObjectURL(b); photoURLs.set(id, u); return u;
}
function hydratePhotos(root=document){

    const id = img.dataset.pid; if (img.dataset.loaded === id) return;
    img.dataset.loaded = id; const u = await photoURL(id); if (u) img.src = u;
  });
}

let settings = { apiKey: "", parseModel: "claude-haiku-5-5", analysisModel: "claude-sonnet-5-5", aiPhoto: true, inciLookup: true, liveCam: true, useAiFill: true, lagIdx: 1, facing: "user", ghost: true, insArea: "all", histArea: "front" };
async function saveSettings(){ await store.set("settings", settings).catch(()=>{}); }
async function claude(content, { model, max_tokens = 1500, signal, tools, raw } = {}){
  if (!settings.apiKey) throw { code: "no_key", message: "Add your Anthropic API key in Settings." };
  if (!navigator.onLine) throw { code: "offline", message: "Offline" };
  let r;
  try {
    r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", signal,
      headers: { "content-type": "application/json", "x-api-key": settings.apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: model || settings.parseModel, max_tokens, messages: [{ role: "user", content }], ...(tools ? { tools } : {}) }) });
  } catch (e) { if (e.name === "AbortError") throw { code: "cancelled" }; throw { code: "network", message: "Network error" }; }
  if (!r.ok) { let m = ""; try { m = (await r.json()).error?.message || ""; } catch {}
    throw { code: r.status === 401 ? "bad_key" : r.status === 429 ? "rate_limited" : r.status === 529 ? "overloaded" : "http_" + r.status, message: m || ("HTTP " + r.status) }; }
  const j = await r.json();
  if (raw) return j;
  return (j.content || []).filter(c => c.type === "text").map(c => c.text).join("");
}
function parseJSON(t){
  try { return JSON.parse(t); } catch {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch {} }
  const i = [t.indexOf("{"), t.indexOf("[")].filter(x => x >= 0).sort((a,b)=>a-b)[0];
  const j = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (i != null && j > i) { try { return JSON.parse(t.slice(i, j+1)); } catch {} }
  throw { code: "invalid_json", message: "Couldn't read Claude's reply" };
}

    if (document.hidden || view !== "log" || !$("#draft").classList.contains("hidden")) { stopCamera(); return; }

  let b; try { b = await compress(f, 1600); } catch { b = f; }
  addShot(b);

async function compress(blob, max){
  const url = URL.createObjectURL(blob);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth*s); c.height = Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(), "image/jpeg", 0.85));
  } finally { URL.revokeObjectURL(url); }
}

const catKey = n => normName(n).toLowerCase();
function ensureCatalog(name, category){
  const k = catKey(name); if (!k) return false;
  const c = catalog[k];
  if (!c) { catalog[k] = { name: normName(name), category: category || "other", url: "", brand: "", inci: [], actives: [], flags: [], status: "new" }; return true; }
  if (category && category !== "other" && (!c.category || c.category === "other")) { c.category = category; return true; }
  return false;
}
async function saveCatalog(){ await store.set("catalog", catalog).catch(()=>{}); }
function syncCatalog(){ let ch = false; for (const e of entries) for (const p of e.products||[]) if (p.name && ensureCatalog(p.name, p.category)) ch = true; if (ch) saveCatalog(); }
function productStats(){
  const now = ymd(Date.now()), st = new Map();
  for (const e of entries) for (const p of e.products||[]) {
    const k = catKey(p.name); if (!k) continue;
    const s = st.get(k) || { days: new Set(), recent: new Set(), last: "" , times: {} };
    s.days.add(e.date); if (dayDiff(e.date, now) <= 30) s.recent.add(e.date); if (e.date > s.last) s.last = e.date;
    s.times[p.time] = (s.times[p.time]||0) + 1;
    st.set(k, s);
  }
  return st;
}
function topProducts(n = 8){
  const st = productStats();
  return Object.keys(catalog).sort((a,b) => {
    const A = st.get(a), B = st.get(b);
    return (B?.recent.size||0) - (A?.recent.size||0) || (B?.days.size||0) - (A?.days.size||0) || (B?.last||"").localeCompare(A?.last||"");
  }).slice(0, n);
}
const defaultTime = () => new Date().getHours() < 15 ? "am" : "pm";
function togglePick(name){
  const k = catKey(name), i = draft.products.findIndex(p => catKey(p.name) === k);
  if (i >= 0) draft.products.splice(i, 1);

/* ================= INCIDecoder lookup ================= */
async function lookupInci(k){
  const c = catalog[k]; if (!c) return;
  const prompt = `Find the skincare product "${c.name}" on INCIDecoder (incidecoder.com) and report its ingredient (INCI) list from the product page.
Reply with only JSON, no prose:
{"found": true|false, "name": "product name as INCIDecoder lists it", "brand": "", "url": "https://incidecoder.com/products/...", "category": "${CATS.join("|")}", "inci": ["Aqua", "Glycerin", "..."], "actives": ["short names of key active ingredients, e.g. Niacinamide 4%"], "flags": ["ingredients commonly flagged as potentially pore-clogging/comedogenic or irritating, if any"]}
Use the exact product (right variant/size doesn't matter). If you can't find it on incidecoder.com, reply {"found": false}.`;
  const j = await claude(prompt, { model: settings.parseModel, max_tokens: 3000, raw: true,
    tools: [{ type: "web_search_20250305", name: "web_search", max_uses: 3, allowed_domains: ["incidecoder.com"] }] });
  const texts = (j.content || []).filter(b => b.type === "text").map(b => b.text);
  let r = null;
  for (let i = texts.length - 1; i >= 0 && !r; i--) { try { r = parseJSON(texts[i]); } catch {} }
  if (!r) { try { r = parseJSON(texts.join("\n")); } catch {} }
  if (!r || !r.found || !Array.isArray(r.inci) || !r.inci.length) { c.status = "notfound"; c.checked = Date.now(); await saveCatalog(); return; }
  const url = String(r.url || ""); 
  Object.assign(c, { url: /^https:\/\/(www\.)?incidecoder\.com\//.test(url) ? url : "", brand: String(r.brand||"").slice(0,60), matchedName: String(r.name||"").slice(0,120),
    inci: r.inci.map(String).map(x=>x.trim()).filter(Boolean).slice(0,80), actives: (r.actives||[]).map(String).slice(0,10), flags: (r.flags||[]).map(String).slice(0,10),
    status: "done", checked: Date.now() });
  if (CATS.includes(r.category) && (!c.category || c.category === "other")) c.category = r.category;
  await saveCatalog();
}

let queueRunning = false;
async function processQueue(){
  if (queueRunning || !settings.apiKey || !navigator.onLine) return;
  queueRunning = true;

    for (const e of entries.slice().filter(x => x.needsParse || x.needsAi).reverse()) {
      if (e.needsParse) {
        await patchEntry(e.id, { status: "parsing" });
        try { const p = await parseMemo(e.memo, e.ts); await patchEntry(e.id, { ...mergeParsed(e, p), needsParse: false, status: "ok", error: "" }); syncCatalog(); }
        catch (err) {
          const transient = ["offline","network","rate_limited","overloaded"].includes(err.code) || String(err.code).startsWith("http_5");
          const keyProblem = err.code === "bad_key" || err.code === "no_key";
          if (transient) { await patchEntry(e.id, { status: "queued" }); break; }
          if (keyProblem) { await patchEntry(e.id, { status: "error", error: errText(err) }); break; }   // stays queued for when the key is fixed
          await patchEntry(e.id, { status: "error", error: errText(err), needsParse: false });
        }
      }
      if (e.needsAi) {
        try {
          const shots = [];
          for (const p of photosOf(e)) { const blob = await store.getPhoto(p.id); if (blob) shots.push({ area: p.area, blob }); }
          if (shots.length) { const ai = await assessPhotos(shots); await patchEntry(e.id, { ai, needsAi: false }); } else await patchEntry(e.id, { needsAi: false });
        }
        catch (err) { if (["offline","network","rate_limited","overloaded"].includes(err.code)) break; await patchEntry(e.id, { needsAi: false }); }
      }
    }
    if (settings.inciLookup) {
      for (const k of Object.keys(catalog).filter(k => catalog[k].status === "new").slice(0, 5)) {
        catalog[k].status = "looking"; renderIfProducts();
        try { await lookupInci(k); }
        catch (err) {
          catalog[k].status = ["offline","network","rate_limited","overloaded"].includes(err.code) ? "new" : "error";
          catalog[k].error = errText(err); await saveCatalog(); renderIfProducts();
          if (catalog[k].status === "new") break;
        }
        renderIfProducts();
      }
    }
  } finally { queueRunning = false; }
}
function renderIfProducts(){ if (view === "products") renderProducts(); if (sheetMode === "product") renderProductSheet(); }
function mergeParsed(e, p){
  const picked = (e.products||[]).filter(x => x.src === "pick" || x.src === "edit");
  const seen = new Set(picked.map(x => catKey(x.name)));

  const fs = new Set(pf.map(x => x.name.toLowerCase()));
  const factors = pf.concat(p.factors.filter(x => !fs.has(x.name.toLowerCase())));
  const bedding = { ...(e.bedding||{}) }; for (const [k] of BEDDING) if (p.bedding?.[k]) bedding[k] = true;
  return { products, factors, bedding, water: e.water ?? p.water ?? null, skin: p.skin, summary: p.summary };
}

Memo:
"""${memo.slice(0, 6000)}"""

Reply with only JSON, no prose:
{"products":[{"name":"Brand Product Name","category":"${CATS.join("|")}","time":"am"|"pm"|"other","dayOffset":0,"area":"all"|"front"|"left"|"right"|"neck","amount":"","note":""}],

async function assessPhotos(shots){

    content.push({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: await blobToB64(small) } });
  }
  content.push({ type: "text", text: `These are photos a person took of their own skin to track their acne over time, one per section (${shots.map(s=>s.area).join(", ")}). Assess only visible acne in each photo, consistently, as a dermatology-style severity estimate.
Reply with only JSON:
{"areas": {"<section>": {"score": number 0-10 or null, "inflamed": integer estimate of red/inflamed papules+pustules, "comedones": "none"|"few"|"many", "regions": ["forehead"|"temples"|"cheeks"|"nose"|"chin"|"jawline"|"neck"|...], "note": "one short neutral sentence"}}}
Use these section keys exactly: ${shots.map(s=>JSON.stringify(s.area)).join(", ")}.
Scale: 0 = clear; 1-2 = a few small spots; 3-4 = mild-moderate, several papules; 5-6 = moderate, many inflamed lesions; 7-8 = severe, widespread or nodules/cysts; 9-10 = extreme.
If skin isn't clearly visible in a photo (blurry, too dark), use score null for it and say why in note.` });
  const r = parseJSON(await claude(content, { model: settings.parseModel, max_tokens: 900 }));
  const areas = {};
  for (const sh of shots) {
    const x = r?.areas?.[sh.area] || {};
    areas[sh.area] = { score: typeof x.score === "number" ? Math.max(0, Math.min(10, x.score)) : null,
      inflamed: Number.isFinite(+x.inflamed) ? Math.round(+x.inflamed) : null, comedones: x.comedones ? String(x.comedones) : null,
      regions: Array.isArray(x.regions) ? x.regions.map(String).slice(0,8) : [], note: x.note ? String(x.note).slice(0,240) : "" };
  }
  const scores = Object.values(areas).map(a => a.score).filter(v => v != null);
  const inflamed = Object.values(areas).map(a => a.inflamed).filter(v => v != null);
  return { score: meanOrNull(scores), inflamed: inflamed.length ? inflamed.reduce((a,b)=>a+b,0) : null,
           regions: [...new Set(Object.values(areas).flatMap(a => a.regions))], note: "", areas };
}

  for (const e of entries.slice(0, 400)) {

    const chips = [...(e.products||[]).map(p=>`<span class="chip">${esc(p.name)}</span>`), ...(e.factors||[]).map(f=>`<span class="chip f">${esc(f.name)}</span>`)].join("");
    h += `<div class="card entry" data-open="${e.id}">
      ${photosOf(e).length?`<img class="thumb" data-pid="${esc(photosOf(e)[0].id)}" alt="">`:`<div class="thumb">✎</div>`}
      <div class="meta"><div class="row" style="justify-content:space-between"><span class="sub">${fmtTime(e.ts)}${photosOf(e).length>1?` · ${photosOf(e).length} photos`:""}${areaSummary(e)}</span>${badge(rr.r, rr.ai)}</div>
      ${e.status==="parsing"||e.status==="queued"?`<div class="sub">${e.status==="parsing"?'<span class="spin"></span> parsing…':"queued"}</div>`:""}
      ${chips?`<div class="chips">${chips}</div>`:(e.memo?`<div class="memo">${esc(e.memo)}</div>`:"")}</div></div>`;
  }
  el.innerHTML = h; hydratePhotos(el);
}

/* ================= analysis ================= */
function dailyRatings(area = "all"){
  const m = new Map();
  for (const e of entries) {
    let r, ai = false;
    if (area === "all") { r = e.rating; if (r == null && settings.useAiFill && e.ai && e.ai.score != null) { r = e.ai.score; ai = true; } }
    else { const x = areaScore(e, area); r = x.r; ai = !!x.ai; if (ai && !settings.useAiFill) r = null; }
    if (r == null) continue;
    if (!m.has(e.date)) m.set(e.date, { you: [], ai: [] });
    m.get(e.date)[ai ? "ai" : "you"].push(r);
  }
  const out = new Map();
  for (const [d, v] of m) out.set(d, v.you.length ? mean(v.you) : mean(v.ai));
  return out;
}
const BED_LIMITS = { pillowcase: [4, "pillowcase 4+ days old"], sheets: [8, "sheets 8+ days old"], towel: [3, "face towel 3+ days old"] };
function exposureMap(){
  const ex = new Map(), observed = new Set(), meta = new Map();   // ex: key -> Map(date -> Set(area))
  const put = (type, name, d, area, category) => {
    const k = keyOf(type, name);
    if (!ex.has(k)) ex.set(k, new Map());
    const m = ex.get(k); if (!m.has(d)) m.set(d, new Set()); m.get(d).add(area || "all");
    const mt = meta.get(k) || { type, name, category, first: d, last: d };
    if (d < mt.first) mt.first = d; if (d > mt.last) mt.last = d; if (category) mt.category = category; mt.name = name;
    meta.set(k, mt);
  };
  const changes = { pillowcase: [], sheets: [], towel: [] };
  for (const e of entries.slice().reverse()) {
    observed.add(e.date);
    for (const p of e.products||[]) if (p.name) { const d = addDays(e.date, p.dayOffset || 0); observed.add(d); put("p", p.name, d, p.area, p.category); }
    for (const f of e.factors||[]) if (f.name) { const d = addDays(e.date, f.dayOffset || 0); observed.add(d); put("f", f.name, d, "all"); }
    if (e.water != null && e.water < 5) put("f", "low water (<5 glasses)", e.date, "all");
    for (const k of Object.keys(changes)) if (e.bedding?.[k]) changes[k].push(e.date);
  }
  // derived: how old the bedding was on each logged day (only once a change has been logged)
  for (const [k, dates] of Object.entries(changes)) {
    if (!dates.length) continue;
    dates.sort();
    const [limit, label] = BED_LIMITS[k];
    for (const d of observed) {
      let last = null; for (const c of dates) { if (c <= d) last = c; else break; }
      if (last && dayDiff(last, d) >= limit) put("f", label, d, "all");
    }
  }
  return { ex, observed, meta };
}
function computeEffects(lag, area = "all"){
  const ratings = dailyRatings(area), { ex, observed, meta } = exposureMap(), res = [];
  for (const [k, dates] of ex) {
    const yes = [], no = [];
    for (const [D, r] of ratings) {
      const win = []; for (let i = lag.a; i <= lag.b; i++) win.push(addDays(D, -i));
      if (!win.some(w => observed.has(w))) continue;
      const hit = w => { const a = dates.get(w); return !!a && (area === "all" || a.has("all") || a.has(area)); };
      (win.some(hit) ? yes : no).push(r);
    }
    if (yes.length < 2 || no.length < 2) continue;
    const delta = mean(yes) - mean(no);
    const se = Math.sqrt(variance(yes)/yes.length + variance(no)/no.length) || 0.5;
    res.push({ k, ...meta.get(k), delta, se, nYes: yes.length, nNo: no.length, z: delta/se });
  }
  return res;
}
function startEffect(m, ratings){
  const before = [], after = [];
  for (const [d, r] of ratings) { const dd = dayDiff(m.first, d); if (dd >= -14 && dd <= -1) before.push(r); else if (dd >= 1 && dd <= 28) after.push(r); }
  if (before.length < 2 || after.length < 2) return null;
  return { before: mean(before), after: mean(after) };
}

function renderProducts(){
  const el = $("#prodBody");
  const { ex, meta } = exposureMap(), ratings = dailyRatings();
  const rows = [...meta.entries()].map(([k, m]) => ({ k, ...m, days: ex.get(k).size, start: startEffect(m, ratings) }));
  const prods = rows.filter(r=>r.type==="p").sort((a,b)=> b.last.localeCompare(a.last) || b.days - a.days);
  const unused = Object.keys(catalog).filter(k => !meta.has(keyOf("p", catalog[k].name)));
  const facs = rows.filter(r=>r.type==="f").sort((a,b)=> b.days - a.days);
  const se = s => s ? `<span style="color:${s.after < s.before - .3 ? "var(--good)" : s.after > s.before + .3 ? "var(--bad)" : "var(--muted)"};font-weight:600">${s.before.toFixed(1)}→${s.after.toFixed(1)}</span>` : `<span class="sub">–</span>`;
  const inciTag = name => { const c = catalog[catKey(name)]; if (!c) return "";
    return c.status === "done" ? ` · <span style="color:var(--good)">INCI ✓</span>${c.flags?.length?` · <span style="color:var(--bad)">${c.flags.length} flagged</span>`:""}` : c.status === "looking" ? ` · <span class="spin"></span>` : ""; };
  // habits
  const today = ymd(Date.now());
  const lastChange = k => { for (const e of entries) if (e.bedding?.[k]) return e.date; return null; };
  const water7 = entries.filter(e => e.water != null && dayDiff(e.date, today) < 7);
  const habit = BEDDING.map(([k,l]) => { const d = lastChange(k); return `<tr><td>${l}</td><td>${d ? (dayDiff(d, today) === 0 ? "changed today" : `changed ${dayDiff(d, today)} day${dayDiff(d,today)===1?"":"s"} ago`) : `<span class="sub">not logged yet</span>`}</td></tr>`; }).join("")
    + `<tr><td>Water</td><td>${water7.length ? `${mean(water7.map(e=>e.water)).toFixed(1)} glasses/day <span class="sub">(last 7 days)</span>` : `<span class="sub">not logged yet</span>`}</td></tr>`;
  el.innerHTML = `
    <h2 style="margin-top:4px">Products</h2>
    <div class="card"><div class="tablewrap"><table>
      <tr><th>Product</th><th>Days</th><th>Last</th><th>Since start</th></tr>
      ${prods.map(r=>`<tr class="click" data-prod="${esc(catKey(r.name))}"><td>${esc(r.name)}<div class="sub">${esc(r.category||"")} · since ${shortDay(r.first)}${inciTag(r.name)}</div></td><td>${r.days}</td><td>${shortDay(r.last)}</td><td>${se(r.start)}</td></tr>`).join("")}
      ${unused.map(k=>`<tr class="click" data-prod="${esc(k)}"><td>${esc(catalog[k].name)}<div class="sub">${esc(catalog[k].category||"")} · not logged yet${inciTag(catalog[k].name)}</div></td><td>0</td><td>–</td><td>–</td></tr>`).join("")}
      ${!prods.length && !unused.length ? `<tr><td colspan="4" class="sub">None yet. Add products from the Log tab.</td></tr>` : ""}
    </table></div>
    <div class="hint">Tap a product for its ingredients and INCIDecoder page. "Since start" = average skin rating 2 weeks before you first logged it → the 4 weeks after. Lower is better.</div></div>
    <h2>Habits</h2>
    <div class="card"><table>${habit}</table></div>
    <h2>Lifestyle factors</h2>
    <div class="card"><div class="tablewrap"><table>
      <tr><th>Factor</th><th>Days</th><th>Last</th></tr>
      ${facs.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.days}</td><td>${shortDay(r.last)}</td></tr>`).join("") || `<tr><td colspan="3" class="sub">None yet</td></tr>`}
    </table></div></div>`;
  el.querySelectorAll("[data-prod]").forEach(tr => tr.onclick = () => openProductSheet(tr.dataset.prod));
}
let sheetProduct = null;
function openProductSheet(k){
  if (!catalog[k]) { const m = [...exposureMap().meta.values()].find(m => catKey(m.name) === k); if (!m) return; ensureCatalog(m.name, m.category); saveCatalog(); }
  sheetMode = "product"; sheetProduct = k; showSheet(); renderProductSheet();
}
function renderProductSheet(){
  const c = catalog[sheetProduct]; if (!c) { closeSheet(); return; }
  const st = productStats().get(sheetProduct);
  const link = c.url || incidecoderSearch(c.name);
  const status = c.status === "done" ? "" : c.status === "looking" ? `<div class="sub"><span class="spin"></span> Looking it up on INCIDecoder…</div>`
    : c.status === "notfound" ? `<div class="sub">Couldn't find this exact product on INCIDecoder. Open the search, find it, and paste the ingredient list below.</div>`
    : c.status === "error" ? `<div class="sub">Lookup failed: ${esc(c.error||"error")}</div>` : !settings.apiKey ? `<div class="sub">Add your API key in Settings to look up ingredients automatically.</div>` : `<div class="sub">Lookup queued.</div>`;
  $("#sheetPanel").innerHTML = `<div class="grab"></div>
    <div class="row" style="justify-content:space-between;margin-bottom:10px;flex-wrap:nowrap"><h2 style="margin:0">${esc(c.name)}</h2><button class="btn" id="pdClose">Done</button></div>
    <div class="card">
      <div class="row" style="justify-content:space-between"><a href="${esc(link)}" target="_blank" rel="noopener">${c.url ? "Open on INCIDecoder ↗" : "Search INCIDecoder ↗"}</a>
        ${settings.apiKey ? `<button class="btn small" id="pdLookup">${c.status==="done"?"Look up again":"Look up ingredients"}</button>` : ""}</div>
      ${c.matchedName && c.matchedName.toLowerCase() !== c.name.toLowerCase() ? `<div class="sub" style="margin-top:6px">Matched: ${esc(c.matchedName)}</div>` : ""}
      ${status}
      ${c.actives?.length ? `<div class="subhead">Key actives</div><div class="chips">${c.actives.map(a=>`<span class="chip">${esc(a)}</span>`).join("")}</div>` : ""}
      ${c.flags?.length ? `<div class="subhead">Flagged ingredients</div><div class="chips">${c.flags.map(a=>`<span class="chip flag">${esc(a)}</span>`).join("")}</div>` : ""}
      ${c.inci?.length ? `<div class="subhead">Ingredients (INCI) · ${c.inci.length}</div><div class="inci">${c.inci.map(esc).join(", ")}</div>` : ""}
    </div>
    <div class="card">
      <div class="label" style="margin-top:0">Category</div>
      <select id="pdCat">${CATS.map(x=>`<option${x===c.category?" selected":""}>${x}</option>`).join("")}</select>
      <div class="label">Ingredient list <span>paste or fix by hand</span></div>
      <textarea id="pdInci" style="min-height:90px" placeholder="Aqua, Glycerin, Niacinamide…">${esc((c.inci||[]).join(", "))}</textarea>
      <button class="primary" id="pdSave">Save</button>
    </div>
    ${st ? `<div class="sub" style="text-align:center">Used on ${st.days.size} day${st.days.size===1?"":"s"} · last ${esc(fmtDay(st.last))}</div>` : ""}`;
  $("#pdClose").onclick = closeSheet;
  const lk = $("#pdLookup"); if (lk) lk.onclick = async () => { c.status = "new"; await saveCatalog(); renderProductSheet(); processQueue(); };
  $("#pdSave").onclick = async () => {
    c.category = $("#pdCat").value;
    const list = $("#pdInci").value.split(/,(?![^(]*\))/).map(x => x.trim()).filter(Boolean).slice(0, 120);
    if (list.join(",") !== (c.inci||[]).join(",")) { c.inci = list; if (list.length) c.status = "done"; }
    await saveCatalog(); toast("Saved"); closeSheet(); render();
  };
}
function toCsv(){
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const out = [["date","time","your_rating","ai_rating","front","left","right","neck","water_glasses","new_pillowcase","new_sheets","new_towel","type","name","category","when","day_offset","applied_to","detail","memo","notes"].join(",")];
  for (const e of entries.slice().reverse()) {
    const base = [e.date, fmtTime(e.ts), e.rating ?? "", e.ai?.score ?? "", ...AREA_KEYS.map(k => areaScore(e, k).r ?? ""), e.water ?? "", ...BEDDING.map(([k]) => e.bedding?.[k] ? 1 : "")];
    const items = [...(e.products||[]).map(p=>["product",p.name,p.category,p.time,p.dayOffset||0,p.area||"all",p.amount||""]), ...(e.factors||[]).map(f=>["factor",f.name,"","",f.dayOffset||0,"",f.detail||""])];
    if (!items.length) items.push(["","","","","","",""]);
    items.forEach((it, i) => out.push([...base, ...it, i===0 ? e.memo||"" : "", i===0 ? e.notes||"" : ""].map(q).join(",")));
  }
  return out.join("\n");
}

function renderInsights(){
  const el = $("#insBody");
  const IA = settings.insArea || "all";
  const ratings = dailyRatings(IA), { meta } = exposureMap();
  const lag = LAGS[settings.lagIdx] || LAGS[1];
  const effs = computeEffects(lag, IA);
  const worse = effs.filter(x=>x.delta > 0.15).sort((a,b)=>b.z-a.z).slice(0,10);
  const better = effs.filter(x=>x.delta < -0.15).sort((a,b)=>a.z-b.z).slice(0,10);
  const conf = z => { const a = Math.abs(z); return a >= 2 ? "strong signal" : a >= 1 ? "some signal" : "weak signal"; };
  const effRow = x => { const w = Math.min(50, Math.abs(x.delta) / 4 * 50), col = x.delta > 0 ? "var(--bad)" : "var(--good)";
    return `<div class="eff"><div class="n">${esc(x.name)}<small>${x.type==="f"?"factor":"product"} · ${conf(x.z)} · ${x.nYes} days vs ${x.nNo}</small></div>
      <div class="bar"><i style="background:${col};${x.delta>0?`left:50%;width:${w}%`:`right:50%;width:${w}%`}"></i></div><div class="delta" style="color:${col}">${x.delta>0?"+":""}${x.delta.toFixed(1)}</div></div>`; };
  const opts = [...meta.entries()].sort((a,b)=>a[1].name.localeCompare(b[1].name)).map(([k,m])=>`<option value="${esc(k)}"${k===overlayKey?" selected":""}>${esc(m.name)}${m.type==="f"?" (factor)":""}</option>`).join("");
  let h = `<div class="seg" id="insAreaSeg" style="margin-top:2px">${[["all","All"],...AREAS].map(([k,l])=>`<button data-a="${k}"${k===IA?' class="on"':""}>${l}</button>`).join("")}</div>
    <h2 style="margin-top:4px">${IA==="all"?"Skin over time":esc(areaLabel(IA))+" over time"}</h2><div class="card">${ratings.size ? trendChart(ratings) : `<div class="sub">Rate your skin when you log to see a trend.</div>`}
    ${meta.size ? `<div class="row" style="margin-top:10px"><span class="sub">Overlay</span><select id="overlay" style="flex:1;padding:7px 9px"><option value="">None</option>${opts}</select></div>` : ""}
    <label class="toggle" style="border:0;padding-bottom:0"><span class="sub">Use AI photo estimate on days you didn't rate</span><input type="checkbox" id="aiFill"${settings.useAiFill?" checked":""}></label></div>`;
  h += `<h2>What's linked to your skin</h2><div class="seg" id="lagSeg">${LAGS.map((l,i)=>`<button data-i="${i}"${i===settings.lagIdx?' class="on"':""}>${l.l}</button>`).join("")}</div>`;
  if (ratings.size < 8) h += `<div class="card"><div class="sub">Needs about 8+ rated days to start comparing (you have ${ratings.size}). Patterns get trustworthy after 3–4 weeks.</div></div>`;
  else h += `<div class="card"><div class="sub" style="margin-bottom:6px">Average skin rating ${lag.a===lag.b?"the day after":`${lag.a}–${lag.b} days after`} each item vs days without it. Higher = worse.</div>
      <h3>Linked to worse skin</h3>${worse.length ? worse.map(effRow).join("") : `<div class="sub">Nothing stands out yet.</div>`}
      <h3>Linked to clearer skin</h3>${better.length ? better.map(effRow).join("") : `<div class="sub">Nothing stands out yet.</div>`}
      <div class="hint" style="margin-top:10px">Correlation, not proof. Daily-use products can't be compared this way; see "Since start" on Products.</div></div>`;
  h += `<h2>Ask Claude</h2><div class="card"><div class="sub">Sends your log as text (no photos) and gets likely triggers, what's working, and an experiment to try next.</div>
    <button class="primary" id="askBtn"${entries.length<3?" disabled":""}>${analysis?"Re-analyze my log":"Analyze my log"}</button>
    <div id="askOut" class="md" style="margin-top:14px">${analysis ? md(analysis.text) + `<div class="hint">From ${esc(new Date(analysis.ts).toLocaleDateString())}, based on ${analysis.n} entries.</div>` : ""}</div></div>`;
  el.innerHTML = h;
  const ov = $("#overlay"); if (ov) ov.onchange = () => { overlayKey = ov.value; renderInsights(); };
  $("#aiFill").onchange = ev => { settings.useAiFill = ev.target.checked; saveSettings(); renderInsights(); };
  $("#lagSeg").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; settings.lagIdx = +b.dataset.i; saveSettings(); renderInsights(); };
  $("#askBtn").onclick = runAnalysis;
  $("#insAreaSeg").onclick = ev => { const b = ev.target.closest("button"); if (!b) return; settings.insArea = b.dataset.a; saveSettings(); renderInsights(); };
}
let askCtl = null;
async function runAnalysis(){
  const btn = $("#askBtn"), out = $("#askOut");
  if (askCtl) { askCtl.abort(); return; }
  askCtl = new AbortController();
  btn.textContent = "Stop"; out.innerHTML = `<div class="sub"><span class="spin"></span> Thinking… this can take up to a minute.</div>`;
  const ratings = dailyRatings(), byDay = new Map();
  const day = d => { if (!byDay.has(d)) byDay.set(d, { p: new Set(), f: new Set(), skin: [], ai: [], misc: [] }); return byDay.get(d); };
  for (const e of entries.slice().reverse()) {
    const d = day(e.date);
    for (const p of e.products||[]) day(addDays(e.date, p.dayOffset||0)).p.add(p.name + (p.time!=="other"?` (${p.time})`:"") + (p.area && p.area!=="all" ? ` [${p.area} only]` : ""));
    if (e.water != null) d.misc.push(`water ${e.water} glasses`);
    for (const [k] of BEDDING) if (e.bedding?.[k]) d.misc.push(`new ${k}`);
    if (e.notes) d.misc.push(`note: ${e.notes.slice(0,200)}`);
    for (const f of e.factors||[]) day(addDays(e.date, f.dayOffset||0)).f.add(f.name + (f.detail?` [${f.detail}]`:""));
    if (e.skin) d.skin.push(e.skin);
    if (e.ai?.regions?.length) d.ai.push(e.ai.regions.join("/"));
  }
  const areaDaily = Object.fromEntries(AREA_KEYS.map(k => [k, dailyRatings(k)]));
  const lines = [...byDay.keys()].sort().slice(-150).map(d => { const v = byDay.get(d), r = ratings.get(d);
    const ar = AREA_KEYS.map(k => areaDaily[k].has(d) ? `${k} ${areaDaily[k].get(d).toFixed(1)}` : null).filter(Boolean).join(", ");
    return `${d} | rating ${r!=null?r.toFixed(1):"-"}${ar?` (${ar})`:""} | products: ${[...v.p].join(", ")||"-"} | factors: ${[...v.f].join(", ")||"-"}${v.misc.length?` | ${v.misc.join("; ")}`:""}${v.skin.length?` | skin: ${v.skin.join("; ")}`:""}${v.ai.length?` | acne areas: ${v.ai.join("; ")}`:""}`; });
  const { meta } = exposureMap();
  const starts = [...meta.values()].filter(m=>m.type==="p").map(m=>{ const s = startEffect(m, ratings); return `${m.name}: first ${m.first}${s?`, avg ${s.before.toFixed(1)} (2wk before) → ${s.after.toFixed(1)} (4wk after)`:""}`; });
  const effs = computeEffects(LAGS[1]).sort((a,b)=>Math.abs(b.z)-Math.abs(a.z)).slice(0,15).map(x=>`${x.name}: ${x.delta>0?"+":""}${x.delta.toFixed(2)} (n=${x.nYes} vs ${x.nNo}, z=${x.z.toFixed(1)})`);
  const prompt = `You're helping someone understand their own acne from a personal log they keep. Ratings are 0 (clear) to 10 (worst), self-rated (or AI-estimated from a photo on days they didn't rate). The overall rating is the average of sections they rated; section ratings (front of face, left side, right side, neck) are in parentheses. Note when a trigger seems to affect one section (e.g. jawline/neck, or one side, which can point to phone, pillow or sleeping side) more than others.

Daily log (oldest first):
${lines.join("\n")}

Ingredients of their products (from INCIDecoder; look for ingredients shared by products that preceded breakouts):
${Object.values(catalog).filter(c => c.inci?.length).slice(0, 40).map(c => `${c.name}: ${c.inci.slice(0, 30).join(", ")}${c.flags?.length ? ` [flagged: ${c.flags.join(", ")}]` : ""}`).join("\n") || "-"}

Derived factors: "pillowcase 4+ days old", "sheets 8+ days old", "face towel 3+ days old" (based on logged bedding changes) and "low water (<5 glasses)".

Product start dates and before/after averages:
${starts.join("\n") || "-"}

Precomputed: difference in average rating 1-3 days after each item vs days without it (positive = worse):
${effs.join("\n") || "-"}

Write a concise, specific analysis in Markdown (under 350 words) with these "#### " headings:
#### Likely triggers - strongest candidates (products, specific ingredients, diet, habits), the evidence from the log, and how confident you are
#### What seems to help
#### New products to watch - say when worsening after starting a product could be purging (retinoids, acids; usually settles within ~4-6 weeks) vs a true reaction
#### Next experiment - one concrete test. For a topical, prefer a split-face test (product on one side only, swap sides after 3-4 weeks); for diet/habits, an on/off block of 2-3 weeks
#### Gaps in the data - what to log more consistently
Be honest about small samples and confounders (things that happen together, the menstrual cycle). Don't invent data. If acne looks severe, scarring, or cystic, suggest a dermatologist in one line.`;
  try {
    const text = await claude(prompt, { model: settings.analysisModel, max_tokens: 2000, signal: askCtl.signal });
    analysis = { text, ts: Date.now(), n: entries.length }; await store.set("analysis", analysis).catch(()=>{});
    out.innerHTML = md(text);
  } catch (e) { out.innerHTML = e.code === "cancelled" ? "" : `<div class="sub">${esc(errText(e))}</div>`; }
  finally { askCtl = null; const b = $("#askBtn"); if (b) b.textContent = "Re-analyze my log"; }
}
function md(src){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<i>$2</i>");
  let h = "", list = false;
  for (const raw of String(src||"").split("\n")) {
    const line = raw.trimEnd();
    const li = line.match(/^\s*[-*•]\s+(.*)/) || line.match(/^\s*\d+[.)]\s+(.*)/);
    if (li) { if (!list) { h += "<ul>"; list = true; } h += `<li>${inline(li[1])}</li>`; continue; }
    if (list) { h += "</ul>"; list = false; }
    const hd = line.match(/^#{1,6}\s+(.*)/);
    if (hd) h += `<h4>${inline(hd[1])}</h4>`; else if (line.trim()) h += `<p>${inline(line)}</p>`;
  }
  if (list) h += "</ul>";
  return h;
}
function trendChart(ratings){
  const today = ymd(Date.now()), dates = [...ratings.keys()].sort();
  let start = dates[0]; if (dayDiff(start, today) > 89) start = addDays(today, -89);
  const span = Math.max(6, dayDiff(start, today));
  const W = 340, H = 170, L = 22, R = 8, T = 8, B = overlayKey ? 34 : 22;
  const x = d => L + (dayDiff(start, d) / span) * (W - L - R);
  const y = r => T + (1 - r/10) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Skin rating trend">`;
  for (const g of [0, 5, 10]) s += `<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${L-6}" y="${y(g)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${g}</text>`;
  const pts = dates.filter(d => d >= start);
  const roll = pts.map(d => [d, mean(pts.filter(o => Math.abs(dayDiff(o, d)) <= 3).map(o => ratings.get(o)))]);
  if (roll.length > 1) s += `<path d="${roll.map(([d,v],i)=>`${i?"L":"M"}${x(d).toFixed(1)},${y(v).toFixed(1)}`).join("")}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".75"/>`;
  for (const d of pts) { const r = ratings.get(d); s += `<circle cx="${x(d).toFixed(1)}" cy="${y(r).toFixed(1)}" r="3.4" fill="${rateColor(r)}"/>`; }
  if (overlayKey) {
    const set = exposureMap().ex.get(overlayKey) || new Map(), yy = H - 18;
    s += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-dasharray="2 3"/>`;
    for (const d of set.keys()) if (d >= start && d <= today) s += `<rect x="${(x(d)-2).toFixed(1)}" y="${yy-5}" width="4" height="10" rx="1.5" fill="var(--accent)"/>`;
  }
  s += `<text x="${L}" y="${H-3}" font-size="10" fill="var(--muted)">${shortDay(start)}</text><text x="${W-R}" y="${H-3}" font-size="10" text-anchor="end" fill="var(--muted)">Today</text></svg>`;
  s += `<div class="legend"><span><i style="background:var(--ink);opacity:.75"></i>7-day average</span><span><i style="background:${rateColor(3)}"></i>daily rating</span>${overlayKey?`<span><i style="background:var(--accent)"></i>days used</span>`:""}</div>`;
  return s;
}
